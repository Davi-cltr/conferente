[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conferente"
version = "0.1.0"
description = "Copiloto fiscal para escritórios de contabilidade: confere IBS/CBS nas NF-e dos clientes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietário - todos os direitos reservados" }
authors = [{ name = "Davi Motta Peluci" }]
dependencies = [
  "lxml>=5",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
conferente = "conferente.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conferente = ["tabelas/*.json", "regras/*.json", "templates/*", "estaticos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
