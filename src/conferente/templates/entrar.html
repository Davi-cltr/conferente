{% extends "base.html" %}
{% block titulo %}Entrar · Conferente{% endblock %}
{% block corpo %}
<div class="w estreito">
  <h1>Entrar</h1>
  <p class="sub">Acesse a conta do seu escritório.</p>
  <form class="caixa campos" method="post" action="/entrar">
    {% if erro %}<div class="msg erro">{{ erro }}</div>{% endif %}
    <div><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email"></div>
    <div><label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password"></div>
    <button class="btn largo" type="submit">Entrar</button>
    <p style="margin:0;font-size:14px;color:var(--suave)">Ainda não tem conta? <a href="/cadastro">Criar conta grátis</a></p>
  </form>
</div>
{% endblock %}
